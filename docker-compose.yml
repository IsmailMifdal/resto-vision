# Tout le service :            docker compose up --build
# Avec la salle simulée (démo) : docker compose --profile demo up --build
# Puis ouvrir http://localhost:8088  (demo@restovision.local / demo1234)
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: restovision
      POSTGRES_USER: restovision
      POSTGRES_PASSWORD: restovision
    ports: ["5432:5432"]
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restovision -d restovision"]
      interval: 3s
      timeout: 3s
      retries: 20
  mqtt:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: ["./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
      mqtt: { condition: service_started }
    environment:
      DB_URL: jdbc:postgresql://db:5432/restovision
      MQTT_URL: tcp://mqtt:1883
      CORS_ORIGINS: http://localhost:4200,http://localhost:8088
    ports: ["8080:8080"]
  web:
    build: ./web
    depends_on: [backend]
    ports: ["8088:80"]
  # Salle simulée : 8 tables et une file, sans caméra. Seulement avec --profile demo.
  simulator:
    profiles: [demo]
    build: ./edge
    depends_on: [mqtt, backend]
    environment:
      RESTOVISION_MQTT_HOST: mqtt
    restart: unless-stopped
volumes:
  db-data:
