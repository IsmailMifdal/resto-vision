# Lance la base, le broker MQTT et le backend :  docker compose up --build
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: restovision
      POSTGRES_USER: restovision
      POSTGRES_PASSWORD: restovision
    ports: ["5432:5432"]
    volumes: ["db-data:/var/lib/postgresql/data"]
  mqtt:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: ["./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
  backend:
    build: ./backend
    depends_on: [db, mqtt]
    environment:
      DB_URL: jdbc:postgresql://db:5432/restovision
      MQTT_URL: tcp://mqtt:1883
    ports: ["8080:8080"]
volumes:
  db-data:
