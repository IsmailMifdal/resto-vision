# Production : chaque boîtier a son identifiant, et la liaison est chiffrée.
#
# Créer les comptes (un par boîtier, un pour le backend) :
#   mosquitto_passwd -c /mosquitto/config/passwords backend
#   mosquitto_passwd    /mosquitto/config/passwords boitier-demo
#
# Un boîtier ne peut écrire que dans les sujets de son restaurant (voir mosquitto.prod.acl).
listener 8883
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acl
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
