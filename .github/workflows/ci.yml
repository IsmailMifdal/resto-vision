name: CI
on:
  push:
  pull_request:

jobs:
  edge:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: edge } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest paho-mqtt
      - run: python -m pytest -q tests

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        with: { name: backend-jar, path: backend/target/backend-0.1.0.jar, retention-days: 7 }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx ng build

  # Chaîne complète : simulateur -> broker MQTT -> backend -> API
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Broker MQTT
        run: docker run -d --name mqtt -p 1883:1883 -v "$PWD/infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" eclipse-mosquitto:2
      - name: Backend
        working-directory: backend
        run: |
          mvn -B -q package -DskipTests
          nohup java -jar target/backend-0.1.0.jar --spring.profiles.active=local > ../backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && break; sleep 2; done
      - name: Simulateur
        working-directory: edge
        run: |
          pip install paho-mqtt
          nohup python -m restovision_edge --config config/edge.example.json --source simulate --publisher mqtt > ../edge.log 2>&1 &
      - name: Vérification
        run: python infra/e2e_check.py
      - name: Journaux
        if: always()
        run: tail -n 60 backend.log; docker logs mqtt 2>&1 | tail -n 20; cat edge.log
